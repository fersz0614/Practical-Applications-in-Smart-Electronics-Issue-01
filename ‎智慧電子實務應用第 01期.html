<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>智慧電子實務應用｜島嶼城市</title>
<style>
:root{--pnl:#fdf7f0;--ink:#26363a;--mut:#7a8a8c;--pri:#3EA6A0;--sec:#E65F2B;--acc:#F2BE22;--ln:rgba(38,54,58,.13);--card:rgba(255,255,255,.88);color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pnl:#102230;--ink:#e6f4f2;--mut:#93b3b0;--ln:rgba(230,244,242,.15);--card:rgba(16,34,48,.88);color-scheme:dark}}
:root[data-theme="dark"]{--pnl:#102230;--ink:#e6f4f2;--mut:#93b3b0;--ln:rgba(230,244,242,.15);--card:rgba(16,34,48,.88);color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);overflow:hidden;background:#cfe3ea}
body>canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.gl{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 4px 18px rgba(0,0,0,.14)}
#brand{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:center;border-radius:18px;padding:8px 16px 8px 10px;pointer-events:none}
#brand img{width:46px;height:46px}
#brand b{display:block;font-size:15px;letter-spacing:.04em}
#brand small{font:600 10px ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--sec)}
#bar{position:fixed;left:calc(50% - 170px);transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:2px;align-items:center;border-radius:999px;padding:5px 8px;max-width:calc(100% - 24px);overflow-x:auto}
body.noside #bar{left:50%}
.tb{border:0;background:none;color:var(--ink);border-radius:14px;padding:4px 8px;font:inherit;font-size:10.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;white-space:nowrap}
.tb span{font-size:17px;line-height:1.2}
.tb.on{background:var(--ink);color:var(--pnl)}
.sep{width:1px;height:28px;background:var(--ln);margin:0 6px}
#tr{position:fixed;right:364px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:8px}
body.noside #tr{right:16px}
#tr button{border:0;border-radius:12px;padding:9px 13px;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer}
#side{position:fixed;right:0;top:0;bottom:0;width:340px;background:var(--pnl);box-shadow:-6px 0 28px rgba(0,0,0,.14);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 22px calc(20px + env(safe-area-inset-bottom,0px));transition:transform .35s;box-sizing:border-box}
body.noside #side{transform:translateX(105%)}
.kick{font:600 10px ui-monospace,Menlo,monospace;letter-spacing:.18em;color:var(--sec)}
#side h1{margin:6px 0 4px;font-size:25px}
#side .sub{font-size:12px;color:var(--mut);margin-bottom:12px}
#q{width:100%;box-sizing:border-box;border:1.5px solid var(--ln);background:transparent;color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit;font-size:13px;margin-bottom:12px}
.tabs{display:flex;gap:8px;margin-bottom:6px}
.tabs button{flex:1;border:1.5px solid var(--ln);background:none;color:var(--ink);border-radius:12px;padding:11px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--pnl);border-color:var(--ink)}
.it{display:flex;align-items:center;gap:14px;padding:13px 2px;border-bottom:1px solid var(--ln);cursor:pointer}
.it:hover{background:rgba(62,166,160,.1)}
.no{font:italic 600 22px Georgia,"Noto Serif TC",serif;color:var(--sec);min-width:30px}
.nm{flex:1;font-size:14.5px;font-weight:600}
.nm em{display:block;font-style:normal;font-weight:400;font-size:11px;color:var(--mut);margin-top:1px}
.it b{font-size:12px;color:var(--pri);font-variant-numeric:tabular-nums;max-width:100px;text-align:right}
#det .no2{display:inline-block;background:var(--pri);color:#fff;border-radius:99px;padding:1px 11px;font-size:12px}
#det h2{margin:8px 0 0;font-size:22px}
#det .en{font-size:12px;color:var(--mut)}
#det h4{margin:15px 0 4px;font-size:11.5px;color:var(--pri);letter-spacing:.1em}
#det p{margin:0;font-size:13px;line-height:1.7}
#back{border:0;background:none;color:var(--mut);font:inherit;font-size:12px;cursor:pointer;padding:0 0 8px}
.m{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--ln);padding:8px 0;font-size:12.5px}
.m b{font-size:16px;color:var(--sec);font-variant-numeric:tabular-nums;text-align:right}
.pp{font-size:12.5px;padding:7px 0;border-top:1px dashed var(--ln);cursor:pointer;line-height:1.5}
.pp span{color:var(--sec);float:right;font-size:11.5px}
.lk{display:block;margin-top:6px;padding:9px 12px;border-radius:10px;background:var(--pri);color:#fff;text-decoration:none;font-size:13px}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.pill{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;background:#fff;color:#26363a;border-radius:99px;padding:3px 11px 3px 6px;font-size:11.5px;font-weight:600;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.18);will-change:transform}
.pill i{font:normal 600 9.5px ui-monospace,monospace;color:var(--sec);margin-right:5px}
#bub{position:fixed;left:0;top:0;pointer-events:none;background:var(--ink);color:var(--pnl);padding:5px 11px;border-radius:12px;font-size:12px;max-width:240px;display:none;will-change:transform}
#tip{position:fixed;pointer-events:none;background:var(--pri);color:#fff;padding:3px 10px;border-radius:8px;font-size:12px;display:none}
#fcard{position:fixed;left:calc(50% - 170px);transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));border-radius:16px;padding:10px 16px;font-size:13px;display:flex;gap:12px;align-items:center}
body.noside #fcard{left:50%}
#fcard button{border:0;border-radius:10px;padding:6px 11px;font:inherit;font-size:12px;cursor:pointer;background:var(--ink);color:var(--pnl)}
#log{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:300px;max-height:230px;overflow:auto;border-radius:16px;padding:10px 14px;font-size:12px;line-height:1.55}
#log time{font:10px ui-monospace,monospace;color:var(--sec);margin-right:5px}
#help{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 40px));border-radius:20px;padding:20px 24px;font-size:13px;line-height:1.8;background:var(--pnl);box-shadow:0 10px 40px rgba(0,0,0,.3)}
@media(max-width:760px){#side{top:auto;height:48%;width:100%;border-radius:20px 20px 0 0}body.noside #side{transform:translateY(105%)}#tr{right:12px;top:auto;bottom:calc(50% + 12px)}body.noside #tr{bottom:16px}#bar{top:calc(78px + env(safe-area-inset-top,0px));left:50%}#brand b{font-size:13px}#fcard,body.noside #fcard{left:50%;bottom:calc(50% + 60px)}#log{display:none}}
#labels,#plabels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.pill{background:rgba(255,255,255,.92)}
.pp2{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;background:rgba(255,255,255,.94);color:#26363a;border-radius:99px;padding:2px 10px 2px 3px;font-size:10.5px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.18);will-change:transform}
.pp2 b{display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;border-radius:50%;background:var(--sec);color:#fff;font-size:9.5px;margin-right:5px}
.hd{display:flex;justify-content:space-between;align-items:flex-start}
.hd button{border:0;background:none;color:var(--ink);font-size:24px;cursor:pointer}
.seg{display:flex;background:rgba(120,120,120,.12);border-radius:12px;padding:4px;margin:12px 0}
.seg button{flex:1;border:0;background:none;color:var(--mut);border-radius:9px;padding:9px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--pnl);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.live{font:700 10px ui-monospace,monospace;color:#2e9e5b;letter-spacing:.1em;white-space:nowrap}
.live:before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#2e9e5b;margin-right:5px}
#lf{border:1.5px solid var(--ln);background:transparent;color:var(--ink);border-radius:10px;padding:9px;font:inherit;font-size:13px;flex:1}
.le{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--ln);font-size:12.5px;line-height:1.55}
.tg{flex:0 0 auto;border-radius:8px;padding:3px 9px;font-size:11.5px;font-weight:700}
.tg.a{background:#dff0f0;color:#1d7f79}.tg.b{background:#f9e0ea;color:#c0385d}.tg.c{background:#fdecc9;color:#b6770d}.tg.d{background:#ececec;color:#666}
.le time{font:10.5px ui-monospace,monospace;color:var(--mut)}
.ov{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ov div{background:rgba(62,166,160,.12);border-radius:12px;padding:12px}.ov b{display:block;font-size:22px;color:var(--sec)}.ov span{font-size:11.5px;color:var(--mut)}
.hintp{font-size:12px;color:var(--mut);line-height:1.7}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.cd{border:1.5px solid var(--pri);border-radius:12px;padding:9px 10px;animation:br 2.4s ease-in-out infinite}
.cd span{display:block;font-size:11px;color:var(--mut)}.cd b{font-size:15px;color:var(--sec);font-variant-numeric:tabular-nums;word-break:break-all}
@keyframes br{0%,100%{box-shadow:0 0 0 0 rgba(62,166,160,.0)}50%{box-shadow:0 0 10px 2px rgba(62,166,160,.45)}}
.mono{font:12px ui-monospace,Menlo,monospace;color:var(--mut)}
.mod{border-top:1px dashed var(--ln);padding:9px 0;font-size:12.5px;line-height:1.6}.mod em{float:right;font-style:normal;color:var(--sec);font-size:11.5px}.mod p{margin:3px 0!important;font-size:12px!important}.mod small{color:var(--mut)}
.dtop,.mq{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:var(--pnl);border-radius:10px;padding:8px 12px;font-size:12px;margin:6px 0}
.okk{color:#5be09a}
#dc{display:block;width:100%;height:auto;background:rgba(120,120,120,.08);border-radius:10px}
.lg{font-size:11px;color:var(--mut);margin:4px 0}.lg i{display:inline-block;width:10px;height:3px;margin:0 3px 3px 8px}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.ga{text-align:center;position:relative}.ga svg{width:100%}.ga b{display:block;font-size:11.5px;margin-top:-18px;font-variant-numeric:tabular-nums}.ga span{font-size:11px;color:var(--mut)}
.sl{display:block;font-size:12px;margin:8px 0}.sl input{width:100%}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-top:1px dashed var(--ln);font-size:13px}
.sw i{width:42px;height:24px;border-radius:99px;background:rgba(120,120,120,.35);position:relative;cursor:pointer;transition:.2s}.sw i:after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.sw i.on{background:var(--pri)}.sw i.on:after{left:21px}
.pr{display:flex;gap:6px}.pr input{flex:1;border:1.5px solid var(--ln);background:transparent;color:var(--ink);border-radius:10px;padding:8px;font:12px ui-monospace,monospace;min-width:0}.pr button{border:0;border-radius:10px;background:#2f6fd6;color:#fff;padding:8px 12px;font:inherit;font-size:12px;cursor:pointer}
.term{background:#0a0f14;color:#5be09a;border-radius:10px;padding:10px;font:11px/1.55 ui-monospace,Menlo,monospace;height:130px;overflow:auto;margin:8px 0;white-space:pre-wrap}
.note{font-size:11px!important;color:var(--mut)}
.jb{display:block;width:100%;margin:10px 0 0;border:0;border-radius:12px;background:var(--sec);color:#fff;padding:11px;font:inherit;font-size:13.5px;cursor:pointer}
#job,#win{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,25,44,.55);z-index:20}
#job[hidden],#win[hidden]{display:none}
.jc{position:relative;width:min(420px,calc(100% - 32px));background:var(--pnl);color:var(--ink);border-radius:20px;overflow:hidden;text-align:center;padding-bottom:22px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.jh{background:#3EA6A0;color:#fff;padding:12px 16px;font-size:13px;display:flex;justify-content:space-between;align-items:center}.jh button{border:0;background:none;color:#fff;font-size:22px;cursor:pointer}
.jc h2{margin:18px 0 6px;font-size:26px}.jn{font-size:14px;margin-bottom:14px}.jn b{color:var(--sec);font-size:22px}
#jgo{border:0;border-radius:14px;background:var(--sec);color:#fff;padding:14px 22px;font:inherit;font-size:15px;cursor:pointer}
.jres{margin:16px 20px 0;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.7;background:rgba(120,120,120,.12);text-align:left}.jres.ok{background:#dff5e6;color:#17623a}.jres.wt{background:#fdf1cc;color:#7a5a00}.jres.no{background:#fbdfe0;color:#8f2630}
.fly{position:absolute;bottom:70px;font-size:22px;pointer-events:none}
#win div{font-size:26px;font-weight:700;color:#fff;text-align:center;line-height:1.6;text-shadow:0 2px 12px rgba(0,0,0,.5)}
#brand.gl{background:rgba(30,41,59,.92);color:#fff}
.uarow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0;font-size:12px}
.uarow select{border:1.5px solid var(--ln);background:transparent;color:var(--ink);border-radius:8px;padding:5px;font:inherit;font-size:11.5px;max-width:150px}
.uarow button{border:0;border-radius:8px;background:var(--ink);color:var(--pnl);padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}.uarow button.on{background:#d9534f;color:#fff}
.arch{display:flex;flex-direction:column;gap:2px}.lay{border:2px solid;border-radius:14px;padding:9px 12px;transition:.3s;font-size:12px}.lay b{font-size:14px;display:block}.lay small{color:var(--mut)}.lay .ic{font-size:18px;margin:3px 0}.lay em{display:block;font-style:normal;color:var(--pri);font-size:11.5px}.lay span{display:block;font:11px ui-monospace,monospace;color:var(--sec);margin-top:2px}.lay.hl{background:rgba(62,166,160,.18);box-shadow:0 0 12px rgba(62,166,160,.5)}.arr{text-align:center;color:#4aa3df;font-size:18px;line-height:1}
.flow{width:100%;background:rgba(120,120,120,.08);border-radius:10px}
</style>
</head>

const pills=I.map((o,i)=>{const d=document.createElement('div');d.className='pill';d.innerHTML=`<i>${String(i).padStart(2,'0')}</i>${o.n}`;d.onclick=()=>sel(i);lab.appendChild(d);return d});
const pps=PE.map((p,j)=>{const d=document.createElement('div');d.className='pp2';d.innerHTML=`<b>${p.type=='INSPECT'?'導':ROLE[p.i]}</b>${p.id} ${p.name}・${TL[p.type]}`;d.onclick=()=>followP(j);ppl.appendChild(d);return d});
const views=['listV','det','logV'];const showV=n=>views.forEach(v=>$(v).hidden=v!=n);
function renderList(){const f=$('q').value.trim().toLowerCase(),box=$('lst');
if(tab==0)box.innerHTML=I.map((o,i)=>(!f||(o.n+o.en).toLowerCase().includes(f))?`<div class="it" data-i="${i}"><span class="no">${String(i).padStart(2,'0')}</span><span class="nm">${o.n}<em>${H[i]}・${o.en}</em></span><b id="L${i}">${fmt(o.m[0],0)}</b></div>`:'').join('');
else box.innerHTML=CL.map((c,k)=>`<div class="it" data-i="${c[0]}"><span class="no">${String(k+1).padStart(2,'0')}</span><span class="nm">島 ${c[0]} → 島 ${c[1]}<em>${c[2]}</em></span></div>`).join('');
box.querySelectorAll('.it').forEach(e=>e.onclick=()=>sel(+e.dataset.i))}

function sel(i){cur=i;stopF();tgt.copy(pos[i]);if(i==7)tgt.y+=1;document.body.classList.remove('noside');$('bLog').classList.remove('on');showDet(i)}
function desel(){cur=-1;tgt.copy(home);showV('listV');$('bLog').classList.remove('on')}
function fcardUpd(){const p=PE[fol];$('fcard').innerHTML=`<span>🧑‍🎓 <b>${p.id} ${p.name}</b>（島 ${p.i}）${p.act}</span><button id="fn">下一位</button><button id="fs">結束</button>`;$('fn').onclick=()=>followP((fol+1)%PE.length);$('fs').onclick=stopF}
function followP(j){fol=j;cur=-1;$('fcard').hidden=false;$('bFol').classList.add('on');fcardUpd()}
function stopF(){fol=-1;$('fcard').hidden=true;$('bFol').classList.remove('on');tgt.copy(cur>=0?pos[cur]:home)}
// log view
const LG=[],TG={'出發':'a','交接':'b','抵達':'c','學習':'d'};
$('lf').innerHTML='<option value="-2">全部協作線</option>'+CL.map((c,k)=>`<option value="${k}">島 ${c[0]} → 島 ${c[1]}</option>`).join('');
function addLog(ty,line,txt){LG.unshift({t:new Date().toTimeString().slice(0,8),ty,line,txt});if(LG.length>120)LG.pop();if(!$('logV').hidden)renderLog()}
function renderLog(){const el=$('lgBody');$('lfrow').hidden=lgTab==0;$('lt0').classList.toggle('on',lgTab==0);$('lt1').classList.toggle('on',lgTab==1);
if(lgTab==0){const mv=PE.filter(p=>p.tr&&p.tr.ph!='home').length;el.innerHTML=`<div class="ov"><div><b>${PE.length}</b><span>在島學員</span></div><div><b>${mv}</b><span>跨島移動中</span></div><div><b>${dep}</b><span>累計出發</span></div><div><b>${CL.length}</b><span>協作線</span></div></div><p class="hintp">打開上方「協作線」，部分學員會走橋前往其他島。</p>`}
else el.innerHTML=LG.filter(e=>lgF==-2||e.line==lgF).slice(0,40).map(e=>`<div class="le"><span class="tg ${TG[e.ty]}">${e.ty}</span><div><time>${e.t}</time><br>${e.txt}</div></div>`).join('')||'<p class="hintp">尚無事件</p>'}
$('lf').onchange=e=>{lgF=+e.target.value;renderLog()};$('lt0').onclick=()=>{lgTab=0;renderLog()};$('lt1').onclick=()=>{lgTab=1;renderLog()};$('lx').onclick=()=>{showV(cur>=0?'det':'listV');$('bLog').classList.remove('on')};
$('q').oninput=renderList;$('tb0').onclick=()=>{tab=0;$('tb0').classList.add('on');$('tb1').classList.remove('on');renderList()};
$('tb1').onclick=()=>{tab=1;$('tb1').classList.add('on');$('tb0').classList.remove('on');colG.visible=true;$('bCol').classList.add('on');renderList()};
renderList();if(innerWidth<760)document.body.classList.add('noside');
[0,1,2,3].forEach(k=>$('t'+k).onclick=()=>setTod(k));
const tog=(id,fn)=>$(id).onclick=()=>fn($(id).classList.toggle('on'));
tog('bLab',on=>{ppl.hidden=!on;lab.hidden=!on});tog('bCol',on=>colG.visible=on);tog('bPau',on=>paused=on);
tog('bLog',on=>{if(on){document.body.classList.remove('noside');showV('logV');renderLog()}else showV(cur>=0?'det':'listV')});
tog('bBird',on=>{if(on){sv=[ph,dist];ph=.12;dist=52}else if(sv){ph=sv[0];dist=sv[1]}});
$('bFol').onclick=()=>{fol<0?followP(Math.floor(Math.random()*PE.length)):stopF()};
$('bFull').onclick=()=>{stopF();desel();th=.75;ph=.95;dist=40;$('bBird').classList.remove('on')};
$('bList').onclick=()=>document.body.classList.toggle('noside');
$('bHelp').onclick=()=>$('help').hidden=!$('help').hidden;$('help').onclick=()=>$('help').hidden=true;
addEventListener('keydown',e=>{if(e.key==='Escape'){stopF();desel();$('help').hidden=true}});
for(let k=0;k<5;k++){const p=PE[(k*7+3)%PE.length];addLog('學習',-1,`<b>${p.id} ${p.name}</b>（島 ${p.i}）${p.act}`)}
setInterval(()=>{if(paused)return;I.forEach((o,i)=>{const e=$('L'+i);if(e)e.textContent=fmt(o.m[0],1)});if(cur>=0)I[cur].m.forEach((m,k)=>{const e=$('mv'+k);if(e)e.textContent=fmt(m,1)})},1500);
setInterval(()=>{if(paused)return;const p=PE[Math.floor(Math.random()*PE.length)];addLog('學習',-1,`<b>${p.id} ${p.name}</b>（島 ${p.i}）${p.act}`)},3200);
// controls
const cv=rd.domElement,ray=new THREE.Raycaster(),mv=new THREE.Vector2(),tip=$('tip');
function hit(e){mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,cam);const hp=ray.intersectObjects(ppick)[0],hi=ray.intersectObjects(pick)[0];hovP=-1;hov=-1;hovG=false;if(hp&&(!hi||hp.distance<hi.distance+.6))hovP=hp.object.userData.p;else if(hi){hov=hi.object.userData.i;hovG=!!hi.object.userData.glass}}
cv.onpointerdown=e=>{dr=[e.clientX,e.clientY];moved=0;cv.setPointerCapture(e.pointerId)};
cv.onpointerup=e=>{if(dr&&moved<5){hit(e);if(hovP>=0)followP(hovP);else if(hovG)openJob();else if(hov>=0)sel(hov);else desel()}dr=null};
cv.onpointermove=e=>{if(dr){const dx=e.clientX-dr[0],dy=e.clientY-dr[1];moved+=Math.abs(dx)+Math.abs(dy);th-=dx*.006;ph=Math.max(.12,Math.min(1.35,ph-dy*.005));dr=[e.clientX,e.clientY]}else{hit(e);cv.style.cursor=hov>=0||hovP>=0?'pointer':'grab';const tx=hovP>=0?PE[hovP].name+'・'+PE[hovP].act:hov>=0?'島 '+hov+'・'+I[hov].n:'';if(tx){tip.style.display='block';tip.textContent=tx;tip.style.left=e.clientX+14+'px';tip.style.top=e.clientY+14+'px'}else tip.style.display='none'}};
cv.onwheel=e=>{e.preventDefault();dist=Math.max(9,Math.min(56,dist+e.deltaY*.02))};
function fit(){rd.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',fit);fit();
setTod(mq.matches?3:1);stepTod(1);
const clk=new THREE.Clock();let ls=-1;const bb=$('bub');
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.1);if(!paused)tt+=dt;const t=tt;
stepTod(.03);
if(!dr&&cur<0&&fol<0&&!paused)th+=.0012;
if(fol>=0){PE[fol].g.getWorldPosition(V);tgt.set(V.x,V.y+.5,V.z)}
ctr.lerp(tgt,fol>=0?.12:.06);const D=fol>=0?Math.min(dist,8):cur>=0?Math.min(dist,16):dist;vd+=(D-vd)*.08;vph+=(ph-vph)*.1;
cam.position.set(ctr.x+Math.sin(th)*Math.sin(vph)*vd,ctr.y+Math.cos(vph)*vd,ctr.z+Math.cos(th)*Math.sin(vph)*vd);cam.lookAt(ctr);
objs.forEach((o,i)=>{const w=(i==hov||i==cur)?1:0;o.glow+=(w-o.glow)*.15;o.base.material.emissive.setHex(PRI);o.base.material.emissiveIntensity=o.glow*.45;o.g.position.y=o.glow*.3+Math.sin(t*1.2+i)*.04});
if(!paused)updT(dt);npcUpdate(t,dt);anim.forEach(f=>f(t));extraLoop(t,dt);
if(Math.floor(t)!=ls){ls=Math.floor(t);sec=ls;ticks.forEach(x=>x.fn&&x.fn())}
pills.forEach((p,i)=>{V.copy(pos[i]);V.y+=2.7;V.project(cam);p.style.display=V.z<1?'':'none';p.style.transform=`translate(${(V.x*.5+.5)*innerWidth}px,${(-V.y*.5+.5)*innerHeight}px) translate(-50%,-100%)`});
if(!ppl.hidden)PE.forEach((p,j)=>{const el=pps[j];if(!p.g.visible){el.style.display="none";return}p.g.getWorldPosition(V);if(V.distanceTo(cam.position)>13){el.style.display='none';return}V.y+=1.1;V.project(cam);el.style.display=V.z<1?'':'none';el.style.transform=`translate(${(V.x*.5+.5)*innerWidth}px,${(-V.y*.5+.5)*innerHeight}px) translate(-50%,-100%)`});
const bp=fol>=0?fol:hovP;if(bp>=0){PE[bp].g.getWorldPosition(V);V.y+=1.1;V.project(cam);bb.style.display='block';bb.textContent=PE[bp].id+' '+PE[bp].name+'：'+PE[bp].act;bb.style.transform=`translate(${(V.x*.5+.5)*innerWidth}px,${(-V.y*.5+.5)*innerHeight}px) translate(-50%,-100%)`}else bb.style.display='none';
rd.render(sc,cam)})();
</script>
